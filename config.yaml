# Airline Data Analysis Configuration File
# This file contains all input/output file paths and directory configurations

# Input Data Configuration
input:
  dataset_path: "backend/data/Airline_Dataset.csv"
  parse_dates: ["Departure Date"]

# Output Configuration
output:
  # Directory where all generated graphs will be saved (also copied to frontend/img)
  graphs_dir: "backend/graphs"
  
  # Graph file names - Meaningful descriptive names
  graphs:
    gender_distribution: "gender_distribution_pie.png"
    top_countries_bar: "top_countries_passengers_bar.png"
    continent_sunburst: "continent_country_sunburst.png"
    age_histogram: "age_distribution_histogram.png"
    age_count_bar: "age_count_distribution_bar.png"
    nationality_pie: "nationality_distribution_pie.png"
    flight_status_pie: "flight_status_distribution_pie.png"
    flight_trends_line: "flight_status_trends_line.png"
    age_trends_line: "average_age_trends_line.png"
    
    # Regional analysis graphs
    asia_bar: "asia_passengers_bar.png"
    asia_pie: "asia_passengers_pie.png"
    europe_bar: "europe_passengers_bar.png"
    europe_pie: "europe_passengers_pie.png"
    north_america_bar: "north_america_passengers_bar.png"
    north_america_pie: "north_america_passengers_pie.png"
    south_america_bar: "south_america_passengers_bar.png"
    south_america_pie: "south_america_passengers_pie.png"
    oceania_bar: "oceania_passengers_bar.png"
    oceania_pie: "oceania_passengers_pie.png"
    africa_bar: "africa_passengers_bar.png"
    africa_pie: "africa_passengers_pie.png"

# Figure settings
figure_settings:
  dpi: 300
  large_figure_size: [14, 8]
  xlarge_figure_size: [18, 10]

# Analysis settings
analysis:
  top_n_countries: 10
  top_n_nationalities: 20
  age_bins: 20
